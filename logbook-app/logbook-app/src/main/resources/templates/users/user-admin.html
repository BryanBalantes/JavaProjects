<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}"></title>
  <link rel="icon" type="image/png" th:href="@{/images/CommercialSpace_Logo.png}">
  <style>
    /* ========================================
       RESET & ROOT VARIABLES
    ======================================== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg-primary: #0f0f23;
        --bg-secondary: #1a1a2e;
        --bg-tertiary: #16213e;

        --text-primary: #ffffff;
        --text-secondary: #a0aec0;
        --text-tertiary: #94a3b8;

        --accent-green: #22c55e;
        --accent-green-hover: #16a34a;

        --accent-blue: #3b82f6;
        --accent-blue-hover: #2563eb;

        --accent-red: #ef4444;
        --accent-red-hover: #dc2626;

        --accent-orange: #f97316;
        --accent-purple: #a78bfa;

        --border-color: #2d3748;

        --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);

        --transition: all 0.3s ease;
    }

    /* ========================================
       BODY
    ======================================== */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        padding-bottom: 90px;
    }

    a{
      text-decoration: none;
      color: #fff;
    }

    /* ========================================
       NAVBAR
    ======================================== */

    .navbar {
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 1px solid var(--border-color);
    background: rgba(26, 26, 46, 0.5);
    backdrop-filter: blur(10px);
}

.navbar-container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 16px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.navbar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.brand-logo {
    height: 40px;
    width: auto;
    max-width: 120px;
    object-fit: contain;
}

.brand-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
}

.navbar-menu {
    display: flex;
    gap: 8px;
    margin-left: 48px;
}

.nav-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
    border: 1px solid transparent;
}

.nav-link:hover {
    background-color: rgba(71, 85, 105, 0.5);
    color: var(--text-primary);
}

.nav-link.active {
    background-color: rgba(167, 139, 250, 0.2);
    color: var(--accent-purple);
    border-color: rgba(167, 139, 250, 0.3);
}

.logout-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
    white-space: nowrap;
}

.logout-btn:hover {
    background-color: rgba(71, 85, 105, 0.5);
    color: var(--text-primary);
}

    /* ========================================
       CONTAINER
    ======================================== */
    .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
    }

    /* ========================================
       PAGE TITLE
    ======================================== */
    .page-title {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
    }

    /* ========================================
       SECTION HEADER
    ======================================== */
    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 1rem;

        margin-bottom: 2rem;
        padding-bottom: 1rem;

        border-bottom: 1px solid var(--border-color);
    }

    .section-title {
        font-size: 1.5rem;
    }

    /* ========================================
       BUTTONS
    ======================================== */
    .btn {
        padding: 0.75rem 1.5rem;

        border: none;
        border-radius: 0.5rem;

        cursor: pointer;

        font-size: 1rem;
        color: white;

        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;

        transition: var(--transition);
    }

    .btn-primary {
        background-color: var(--accent-green);
    }

    .btn-primary:hover {
        background-color: var(--accent-green-hover);
        transform: translateY(-2px);
    }

    .btn-secondary {
        background-color: var(--accent-blue);
    }

    .btn-secondary:hover {
        background-color: var(--accent-blue-hover);
    }

    .btn-danger {
        background-color: var(--accent-red);
    }

    .btn-danger:hover {
        background-color: var(--accent-red-hover);
    }

    .btn-small {
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
    }

    /* ========================================
       USER DETAILS
    ======================================== */
    .detail-info {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .detail-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 2rem;
        flex-wrap: wrap;

        margin-bottom: 2rem;
    }

    .detail-avatar {
        width: 180px;
        height: 180px;

        border-radius: 50%;
        object-fit: cover;

        border: 3px solid var(--border-color);

        display: block;
    }

    .detail-actions {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .info-group {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
    }

    .info-field {
        background-color: var(--bg-secondary);

        padding: 1.5rem;

        border-radius: 0.75rem;
        border: 1px solid var(--border-color);

        animation: slideIn 0.3s ease-out;
    }

    .info-label {
        font-size: 0.875rem;
        color: var(--text-secondary);

        text-transform: uppercase;
        letter-spacing: 0.05em;

        margin-bottom: 0.5rem;
    }

    .info-value {
        font-size: 1.125rem;
        font-weight: 500;
    }

    /* ========================================
       CARD LAYOUT
    ======================================== */
    .table-wrapper {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
    }

    .card-container {
        background-color: var(--bg-secondary);

        border: 1px solid var(--border-color);
        border-radius: 0.75rem;

        padding: 1.5rem;

        display: flex;
        flex-direction: column;
        gap: 1rem;

        transition: var(--transition);
    }

    .card-container:hover {
        background-color: var(--bg-tertiary);
        transform: translateY(-2px);
    }

    .card-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
    }

    .card-row {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .card-label {
        font-size: 0.75rem;
        font-weight: 600;

        color: var(--text-secondary);

        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .card-value {
        font-size: 1rem;
        font-weight: 500;

        word-break: break-word;
    }

    .card-footer {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;

        margin-top: 1rem;
        padding-top: 1rem;

        border-top: 1px solid var(--border-color);
    }

    .proof-image {
        width: 70px;
        height: 70px;

        border-radius: 8px;
        object-fit: cover;
    }

    .card-image-container {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* ========================================
       MODALS
    ======================================== */
    .modal {
        display: none;

        position: fixed;
        inset: 0;

        z-index: 1000;

        justify-content: center;
        align-items: center;

        padding: 1rem;

        background-color: rgba(0, 0, 0, 0.7);
    }

    .modal.active {
        display: flex;
    }

    .modal-content {
        width: 100%;
        max-width: 600px;
        max-height: 90vh;

        overflow-y: auto;

        padding: 2rem;

        background-color: var(--bg-secondary);

        border: 1px solid var(--border-color);
        border-radius: 0.75rem;

        box-shadow: var(--shadow);
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 1.5rem;
        padding-bottom: 1rem;

        border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
        font-size: 1.5rem;
        font-weight: 600;
    }

    .modal-close {
        background: none;
        border: none;

        font-size: 1.5rem;

        color: var(--text-secondary);

        cursor: pointer;

        transition: var(--transition);
    }

    .modal-close:hover {
        color: var(--text-primary);
    }

    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;

        margin-top: 2rem;
        padding-top: 1rem;

        border-top: 1px solid var(--border-color);
    }

    /* ========================================
       FORMS
    ======================================== */
    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
    }

    label {
        display: block;
        margin-bottom: 0.5rem;

        color: var(--text-secondary);
        font-weight: 500;
    }

    input,
    select,
    textarea {
        width: 100%;

        padding: 0.75rem;

        background-color: var(--bg-tertiary);

        border: 1px solid var(--border-color);
        border-radius: 0.5rem;

        color: var(--text-primary);

        font-family: inherit;

        transition: var(--transition);
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: var(--accent-green);

        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
    }

    textarea {
        resize: vertical;
        min-height: 100px;
    }

    /* ========================================
       IMAGE PREVIEW
    ======================================== */
    .preview {
        margin-top: 1rem;
        display: flex;
        justify-content: center;
    }

    .preview img {
        width: 100%;
        max-width: 250px;

        border-radius: 0.75rem;
        border: 1px solid var(--border-color);

        object-fit: cover;
    }

    /* ========================================
       BADGES
    ======================================== */
    .badge {
        display: inline-block;

        padding: 0.25rem 0.75rem;

        border-radius: 0.25rem;

        font-size: 0.875rem;
        font-weight: 600;

        text-transform: uppercase;
    }

    .badge-active {
        background-color: rgba(34, 197, 94, 0.1);
        color: var(--accent-green);
    }

    .badge-inactive {
        background-color: rgba(160, 174, 192, 0.1);
        color: var(--text-secondary);
    }

    .badge-pending {
        background-color: rgba(249, 115, 22, 0.1);
        color: var(--accent-orange);
    }

    /* ========================================
       BOTTOM NAVIGATION
    ======================================== */
    .bottom-nav {
        display: none;

        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;

        z-index: 999;

        height: 70px;

        background: var(--bg-secondary);

        border-top: 1px solid var(--border-color);

        justify-content: space-between;
        align-items: center;

        padding: 0 10px;
    }

    .bottom-nav-item,
    .nav-spacer {
        flex: 1;
    }

    .bottom-nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        gap: 4px;

        min-height: 50px;

        text-decoration: none;

        font-size: 11px;
        color: var(--text-tertiary);

        transition: var(--transition);
    }

    .bottom-nav-item svg {
        width: 22px;
        height: 22px;

        stroke: currentColor;
    }

    .bottom-nav-item.active {
        color: var(--accent-blue);
    }

    .center-btn {
        position: absolute;

        left: 50%;
        transform: translateX(-50%);

        bottom: 35px;

        width: 60px;
        height: 60px;

        border-radius: 50%;

        background: linear-gradient(
            135deg,
            var(--bg-primary) 0%,
            var(--bg-secondary) 50%,
            var(--bg-primary) 100%
        );

        display: flex;
        justify-content: center;
        align-items: center;

        border: 4px solid var(--bg-secondary);

        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
    }

    .center-btn img {
        width: 50px;
        height: 50px;

        object-fit: contain;
    }

    /* ========================================
       ANIMATIONS
    ======================================== */
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* ========================================
       RESPONSIVE
    ======================================== */
    @media (min-width: 768px) {
        .table-wrapper {
            grid-template-columns: repeat(2, 1fr);
        }

        .card-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (min-width: 1200px) {
        .table-wrapper {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (max-width: 1023px) {
        .navbar {
            display: none;
        }

        .bottom-nav {
            display: flex;
        }
    }

    @media (max-width: 768px) {
        .container {
            padding: 1rem;
        }

        .page-title {
            font-size: 2rem;
        }

        .detail-header {
            flex-direction: column;
            align-items: center;
        }

        .detail-avatar {
            width: 100%;
            max-width: 280px;
            height: auto;
            aspect-ratio: 3 / 4;
        }

        .detail-actions {
            width: 100%;
        }

        .detail-actions .btn {
            flex: 1;
        }

        .info-group,
        .form-row {
            grid-template-columns: 1fr;
        }

        .section-header {
            flex-direction: column;
            align-items: flex-start;
        }

        .modal-content {
            padding: 1.25rem;
        }
    }

    @media (max-width: 480px) {
        html,
        body {
            font-size: 15px;
        }

        .bottom-nav {
            height: 60px;
        }

        .bottom-nav-item span {
            display: block;
            font-size: 11px;
            margin-top: 3px;
            text-align: center;
        }

        .center-btn {
            width: 55px;
            height: 55px;
        }

        .center-btn img {
            width: 45px;
            height: 45px;
        }

        .brand-text {
            display: none;
        }
    }

    @media (min-width: 1024px) {
        body {
            padding-bottom: 0;
        }
    }

    @media (max-height: 500px) and (orientation: landscape) {
        .bottom-nav {
            height: 50px;
        }
    }

    /* ========================================
   MOBILE PROFILE LAYOUT
======================================== */
@media (max-width: 768px) {

    .detail-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1rem;
    }

    .detail-header > div:first-child {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .page-title {
        order: 2;
        margin-top: 1rem;
        font-size: 1.8rem;
        text-align: center;
    }

    .detail-avatar {
        width: 180px;
        height: 180px;

        border-radius: 50%;
        object-fit: cover;

        aspect-ratio: 1 / 1;

        display: block;
    }

    .detail-actions {
        width: 100%;
        justify-content: center;
    }

    .detail-actions .btn {
        flex: 1;
    }
}
  </style>
</head>

      <div class="detail-actions">
        <button class="btn btn-secondary" onclick="openModal('editUserModal')">✎ Edit Profile</button>
        <button class="btn btn-danger" onclick="openDeleteConfirm('user', 'John Doe')">🗑 Delete User</button>
      </div>
    </div>

    <div class="detail-info">
      <div class="info-group">
        <div class="info-field">
          <div class="info-label">Address</div>
          <div th:text="${user.address}" class="info-value"></div>
        </div>
        <div class="info-field">
          <div class="info-label">Contact</div>
          <div th:text="${user.contactNumber}" class="info-value"></div>
        </div>
      </div>

      <div class="info-group">
        <div class="info-field">
          <div class="info-label">Email</div>
          <div th:text="${user.emailAddress}" class="info-value"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODALS -->

<!-- Edit User Modal -->
<div id="editUserModal" class="modal" onclick="closeModalOnBackdrop(event, 'editUserModal')">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">Edit User Profile</h2>
      <button class="modal-close" onclick="closeModal('editUserModal')">×</button>
    </div>
    <form id="editUserForm" th:action="@{/users/update}"
          th:object="${user}"
          th:method="post">
      <input type="hidden"
             th:field="*{id}">
      <div class="form-row">
        <div class="form-group">
          <label for="editUserFirstName">First Name</label>
          <input th:field="*{firstName}" type="text" id="editUserFirstName" required>
        </div>
        <div class="form-group">
          <label for="editUserMiddleName">Middle Name</label>
          <input th:field="*{middleName}" type="text" id="editUserMiddleName" required>
        </div>
        <div class="form-group">
          <label for="editUserLastName">Last Name</label>
          <input th:field="*{lastName}" type="text" id="editUserLastName" required>
        </div>
        <div class="form-group">
          <label for="editUserEmail">Email</label>
          <input th:field="*{emailAddress}" type="email" id="editUserEmail" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="editUserPhone">Phone</label>
          <input th:field="*{contactNumber}" type="tel" id="editUserPhone" required>
        </div>
        <div class="form-group">
          <label for="editUserAddress">Address</label>
          <input th:field="*{address}" type="text" id="editUserAddress" required>
        </div>
      </div>
      <div class="form-group">
        <label>Status</label>
        <div class="info-value">
            <span th:if="${user.active}" class="badge badge-active">
                ACTIVE
            </span>
          <span th:unless="${user.active}" class="badge badge-inactive">
            INACTIVE
            </span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('editUserModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteConfirmModal" class="modal" onclick="closeModalOnBackdrop(event, 'deleteConfirmModal')">
  <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 400px;">
    <div class="modal-header">
      <h2 class="modal-title">Confirm Delete</h2>
      <button class="modal-close" onclick="closeModal('deleteConfirmModal')">×</button>
    </div>
    <p id="deleteMessage" style="color: var(--text-secondary); margin-bottom: 1.5rem;"></p>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal('deleteConfirmModal')">Cancel</button>
      <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
  let currentDeleteItem = null;

  // Open Modal
  function openModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) {
          modal.classList.add('active');
      }
  }

  // Close Modal
  function closeModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) {
          modal.classList.remove('active');
      }
  }

  // Close Modal on Backdrop Click
  function closeModalOnBackdrop(event, modalId) {
      if (event.target.id === modalId) {
          closeModal(modalId);
      }
  }

  // Confirm Delete
  function confirmDelete() {
      if (currentDeleteItem) {
          console.log(`[v0] Deleting ${currentDeleteItem.type}: ${currentDeleteItem.item}`);
          // TODO: Send DELETE request to backend
          closeModal('deleteConfirmModal');
          currentDeleteItem = null;
      }
  }

  // Close modal when pressing Escape key
  document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
          const activeModal = document.querySelector('.modal.active');
          if (activeModal) {
              activeModal.classList.remove('active');
          }
      }
  });

    function previewImage(event) {
    const input = event.target;
    const preview = document.getElementById("preview");

    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function (e) {
        preview.src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }
  }
</script>
</body>
</html>
