<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title th:text="${title} + ' | List'"></title>
    <link rel="icon" type="image/png" th:href="@{/images/CommercialSpace_Logo.png}">
    <style>
        :root {
            --bg-primary: #0f0f1e;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --bg-card: rgba(26, 26, 46, 0.4);
            --bg-card-hover: rgba(26, 26, 46, 0.6);
            --text-primary: #f8f8f8;
            --text-secondary: #a0a0b0;
            --text-tertiary: #6b7280;
            --border-color: rgba(51, 65, 85, 0.5);
            --border-color-light: rgba(71, 85, 105, 0.3);
            --accent-purple: #a78bfa;
            --accent-blue: #60a5fa;
            --accent-amber: #fbbf24;
            --accent-jade: #10BD3E;
            --accent-red: #ef4444;
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background-color: var(--bg-primary);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            font-size: 16px;
        }

        a {
            text-decoration: none;
        }

        main {
            width: 100%;
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ========================================
           NAVIGATION BAR (Desktop)
           ======================================== */
            .navbar {
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 1px solid var(--border-color);
    background: rgba(26, 26, 46, 0.5);
    backdrop-filter: blur(10px);
}

.navbar-container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 16px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.navbar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.brand-logo {
    height: 40px;
    width: auto;
    max-width: 120px;
    object-fit: contain;
}

.brand-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
}

.navbar-menu {
    display: flex;
    gap: 8px;
    margin-left: 48px;
}

.nav-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
    border: 1px solid transparent;
}

.nav-link:hover {
    background-color: rgba(71, 85, 105, 0.5);
    color: var(--text-primary);
}

.nav-link.active {
    background-color: rgba(167, 139, 250, 0.2);
    color: var(--accent-purple);
    border-color: rgba(167, 139, 250, 0.3);
}

.logout-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
    white-space: nowrap;
}

.logout-btn:hover {
    background-color: rgba(71, 85, 105, 0.5);
    color: var(--text-primary);
}

        /* ========================================
           MOBILE BOTTOM NAVIGATION
           ======================================== */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 70px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            padding-bottom: max(0px, env(safe-area-inset-bottom));
            z-index: 999;
        }

        .bottom-nav-item,
        .nav-spacer {
            flex: 1;
            text-align: center;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-tertiary);
            transition: var(--transition);
            min-height: 50px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: transparent;
            gap: 4px;
        }

        .bottom-nav-item svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
        }

        .bottom-nav-item.active {
            color: var(--accent-blue);
        }

        .bottom-nav-item.active svg {
            stroke: var(--accent-blue);
        }

        .center-btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(35px + max(0px, env(safe-area-inset-bottom) / 2));
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-primary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            border: 4px solid var(--bg-secondary);
            z-index: 1000;
            cursor: pointer;
            text-decoration: none;
        }

        .center-btn img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        /* ========================================
           USERS SECTION
           ======================================== */
        .users-section {
            padding: 40px 24px;
            min-height: calc(100vh - 64px);
        }

        .section-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 32px;
        }

        .section-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .btn-add-user {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background-color: var(--accent-jade);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn-add-user:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }

        .btn-add-user svg {
            width: 18px;
            height: 18px;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .user-card {
            width: 100%;
            padding: 24px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background-color: var(--bg-card);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .user-card:hover {
            background-color: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-jade);
        }

        .user-card img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 16px;
            background-color: var(--bg-secondary);
        }

        .user-card h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .btn-view {
            padding: 8px 50px;
            background-color: var(--bg-card);
            color: #10BD3E;
            border: 1px solid #10BD3E;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            font-family: inherit;
        }

        .btn-view:hover {
            background-color: #10BD3E;
            color: #ffff;
            border: 1px solid white;
        }

        /* ========================================
           FOOTER
           ======================================== */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 32px 24px;
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
        }

        /* ========================================
           RESPONSIVE DESIGN - DESKTOP (1024px+)
           ======================================== */
        @media (min-width: 1024px) {
            .navbar {
                display: block;
            }

            .bottom-nav {
                display: none;
            }

            .container {
                padding: 0 32px;
            }

            .navbar-container {
                padding: 0 32px;
            }

            .users-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            }

            .section-header {
                margin-bottom: 40px;
            }

            .users-section {
                padding: 48px 32px;
            }
        }

        /* ========================================
           RESPONSIVE DESIGN - TABLET (768px - 1023px)
           ======================================== */
        @media (max-width: 1023px) {
            .navbar {
                display: none;
            }

            .bottom-nav {
                display: flex;
            }

            .navbar-brand {
                display: none;
            }

            .navbar-menu {
                display: none;
            }

            .users-section {
                padding: 24px 20px 100px 20px;
            }

            .users-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 20px;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
                margin-bottom: 24px;
            }

            .section-header h1 {
                font-size: 28px;
                width: 100%;
            }

            .btn-add-user {
                width: 100%;
                justify-content: center;
            }

            .container {
                padding: 0 20px;
            }

            .user-card {
                padding: 20px;
            }

            .user-card img {
                width: 140px;
                height: 140px;
            }

            footer {
                padding: 24px 20px;
            }
        }

        /* ========================================
           RESPONSIVE DESIGN - MOBILE (481px - 767px)
           ======================================== */
        @media (max-width: 767px) {
            .navbar {
                display: none;
            }

            .bottom-nav {
                display: flex;
            }

            .container {
                padding: 0 16px;
            }

            .users-section {
                padding: 20px 16px 100px 16px;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                margin-bottom: 20px;
            }

            .section-header h1 {
                font-size: 24px;
                width: 100%;
            }

            .btn-add-user {
                width: 100%;
                justify-content: center;
                padding: 10px 16px;
                font-size: 13px;
            }

            .users-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .user-card {
                padding: 18px;
            }

            .user-card img {
                width: 130px;
                height: 130px;
            }

            .user-card h3 {
                font-size: 16px;
            }

            .btn-view {
                padding: 8px 20px;
                font-size: 13px;
            }

            footer {
                padding: 20px 16px;
                font-size: 13px;
            }
        }

        /* ========================================
           RESPONSIVE DESIGN - SMALL MOBILE (320px - 480px)
           ======================================== */
        @media (max-width: 480px) {
            html, body {
                font-size: 15px;
            }

            .container {
                padding: 0 12px;
            }

            .navbar {
                display: none;
            }

            .bottom-nav {
                display: flex;
                height: 60px;
            }

            .bottom-nav-item {
                font-size: 10px;
                min-height: 45px;
            }

            .bottom-nav-item svg {
                width: 20px;
                height: 20px;
            }

            .bottom-nav-item span {
                display: block;
                font-size: 11px;
                margin-top: 3px;
                text-align: center;
            }

            .center-btn {
                width: 55px;
                height: 55px;
                border-width: 3px;
            }

            .center-btn img {
                width: 45px;
                height: 45px;
            }

            .users-section {
                padding: 16px 12px 80px 12px;
            }

            .section-header {
                gap: 10px;
                margin-bottom: 16px;
            }

            .section-header h1 {
                font-size: 20px;
            }

            .btn-add-user {
                padding: 9px 14px;
                font-size: 12px;
                gap: 6px;
            }

            .btn-add-user svg {
                width: 16px;
                height: 16px;
            }

            .users-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .user-card {
                padding: 16px;
            }

            .user-card img {
                width: 110px;
                height: 110px;
                margin-bottom: 12px;
            }

            .user-card h3 {
                font-size: 15px;
                margin-bottom: 12px;
            }

            .btn-view {
                padding: 7px 18px;
                font-size: 12px;
            }

            footer {
                padding: 16px 12px;
                font-size: 12px;
            }

            .brand-text {
                display: none;
            }
        }

        /* ========================================
           LANDSCAPE ORIENTATION FIX
           ======================================== */
        @media (max-height: 500px) and (orientation: landscape) {
            .users-section {
                padding: 12px 16px 80px 16px;
            }

            .section-header {
                margin-bottom: 12px;
            }

            .section-header h1 {
                font-size: 22px;
            }

            .users-grid {
                gap: 14px;
            }

            .user-card {
                padding: 14px;
            }

            .user-card img {
                width: 100px;
                height: 100px;
                margin-bottom: 10px;
            }

            .bottom-nav {
                height: 50px;
            }
        }
    </style>
</head>
<body>
<main>
    <!-- DESKTOP NAVIGATION -->
    <nav class="navbar">
        <div class="navbar-container">
            <div href="/" class="navbar-brand">
                <img th:src="@{/images/CommercialSpace_Logo.png}" alt="D AND J RENTALS" class="brand-logo">
                <span class="brand-text">D AND J RENTALS</span>
            </div>

            <div class="navbar-menu">
                <a th:href="@{/homepage/}" class="nav-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>Home</span>
                </a>
                <a th:href="@{/users/}" class="nav-link active">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Users</span>
                </a>
                <a th:href="@{/leases/add}" class="nav-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path>
                        <path d="M15 3v4h4"></path>
                        <path d="M9 16l5-5 2 2-5 5H9v-2z"></path>
                        <path d="M13 10l2 2"></path>
                    </svg>
                    <span>Leases</span>
                </a>

                <a th:href="@{/commercial-units}" class="nav-link">
                    <svg width="16" height="16" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">

                        <!-- Building -->
                        <rect x="3" y="2" width="14" height="20" rx="2"></rect>

                        <!-- Windows -->
                        <path d="M7 6h.01"></path>
                        <path d="M11 6h.01"></path>
                        <path d="M7 10h.01"></path>
                        <path d="M11 10h.01"></path>
                        <path d="M7 14h.01"></path>
                        <path d="M11 14h.01"></path>

                        <!-- Door -->
                        <path d="M8 22v-4h4v4"></path>

                        <!-- Plus Sign -->
                        <path d="M20 8v6"></path>
                        <path d="M17 11h6"></path>
                    </svg>

                    <span>Units</span>
                </a>
            </div>

            <a th:href="@{/logout}" class="logout-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Logout</span>
            </a>
        </div>
    </nav>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
<!--        <a th:href="@{/homepage/}" class="bottom-nav-item">-->
<!--            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">-->
<!--                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>-->
<!--                <polyline points="9 22 9 12 15 12 15 22"></polyline>-->
<!--            </svg>-->
<!--            <span>Home</span>-->
<!--        </a>-->

        <a th:href="@{/commercial-units}" class="bottom-nav-item">
            <svg width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">

                <!-- Building -->
                <rect x="3" y="2" width="14" height="20" rx="2"></rect>

                <!-- Windows -->
                <path d="M7 6h.01"></path>
                <path d="M11 6h.01"></path>
                <path d="M7 10h.01"></path>
                <path d="M11 10h.01"></path>
                <path d="M7 14h.01"></path>
                <path d="M11 14h.01"></path>

                <!-- Door -->
                <path d="M8 22v-4h4v4"></path>

                <!-- Plus Sign -->
                <path d="M20 8v6"></path>
                <path d="M17 11h6"></path>
            </svg>

            <span>Units</span>
        </a>

        <a th:href="@{/users/}" class="bottom-nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Users</span>
        </a>

        <div class="nav-spacer"></div>

        <a th:href="@{/leases/add}" class="bottom-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path>
                <path d="M15 3v4h4"></path>
                <path d="M9 16l5-5 2 2-5 5H9v-2z"></path>
                <path d="M13 10l2 2"></path>
            </svg>
            <span>Leases</span>
        </a>

        <a th:href="@{/logout}" class="bottom-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Logout</span>
        </a>

        <a th:href="@{/homepage/}" class="center-btn">
            <img src="/images/CommercialSpace_Logo.png" alt="logo">
        </a>
    </nav>

    <!-- USERS SECTION -->
    <section class="users-section">
        <div class="container">
            <div class="section-header">
                <h1>Users</h1>
                <a href="/users/add" class="btn-add-user">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                    Add User
                </a>
            </div>

            <div class="users-grid">
                <div class="user-card" th:each="user : ${users}">
                    <img th:src="${user.profilePicUrl}"
                         alt="Profile Image">

                    <h3 th:text="${user.firstName + ' ' + user.lastName}">
                        Full Name
                    </h3>

                    <a th:href="@{/users/view/{id}(id=${user.id})}"
                       class="btn-view">
                        View
                    </a>

                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>&copy; 2025 Uplift Java Bootcamp Batch 2 - LogBook Application</p>
        </div>
    </footer>
</main>
</body>
</html>
