<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>LogBook Application</title>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- CSS -->
</head>
<body>
<main>
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none">
                <span class="fs-4">LOG BOOK</span>
            </a>
            <ul class="nav nav-pills">
                <li class="nav-item"><a th:href="@{/}" class="nav-link" aria-current="page">Home</a></li>
                <li class="nav-item"><a th:href="@{/todos/}" class="nav-link">View TODOs</a></li>
                <li class="nav-item"><a th:href="@{/todos/add}" class="nav-link">Add TODO</a></li>
                <li class="nav-item"><a th:href="@{/records/}" class="nav-link">View Payment Records</a></li>
                <li class="nav-item"><a th:href="@{/records/add}" class="nav-link">Add Payment Records</a></li>
                <li class="nav-item"><a th:href="@{/users/}" class="nav-link">View Users</a></li>
                <li class="nav-item"><a th:href="@{/users/add}" class="nav-link">Add User</a></li>
                <li class="nav-item"><a th:href="@{/logout}" class="nav-link">Logout</a></li>
            </ul>
        </header>
    </div>
    <div class="container">
        <h1>Update User</h1>
        <form th:action="@{/users/update}" th:object="${user}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="id" th:field="*{id}">
            <div class="mb-3">
                <label for="image" class="form-label">Update Profile Picture</label>
                <input class="form-control" type="file" id="image" name="image" accept="image/*">
            </div>
            <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" rows="3" th:field="*{firstName}"/>
            </div>
            <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" rows="3" th:field="*{lastName}"/>
            </div>
            <div class="mb-3">
                <label for="middleName" class="form-label">Middle Name</label>
                <input type="text" class="form-control" id="middleName" rows="3" th:field="*{middleName}"/>
            </div>
            <div class="mb-3">
                <label for="contactNumber" class="form-label">Contact Number</label>
                <input type="text" class="form-control" id="contactNumber" rows="3" th:field="*{contactNumber}"/>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" rows="3" th:field="*{address}"/>
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-outline-primary">Update User...</button>
            </div>
        </form>
    </div>

    <div class="container">
        <form th:action="@{/users/{id}(id=${user.id})}" th:Object="${user}" th:method="delete">
            <div class="mb-3">
                <button type="submit" class="btn btn-danger">Delete Task...</button>
            </div>
        </form>
    </div>

    <div class="container">
        <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
            <div class="col-md-4 d-flex align-items-center">
                <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1" aria-label="Bootstrap">
                </a> <span class="mb-3 mb-md-0 text-body-secondary">© 2025 Company, Inc</span></div>
            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Instagram">
                </a></li>
                <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Facebook">
                </a></li>
            </ul>
        </footer>
    </div>
</main>

<!-- JS Script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<!-- JS Script -->
</body>
</html>
