<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>LogBook Application</title>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- CSS -->
</head>
<body>
<main>
    <div class="container">
        <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none">
                <span class="fs-4">LOG BOOK</span>
            </a>
            <ul class="nav nav-pills">
                <li class="nav-item"><a th:href="@{/}" class="nav-link" aria-current="page">Home</a></li>
                <li class="nav-item"><a th:href="@{/todos/}" class="nav-link active">View TODOs</a></li>
                <li class="nav-item"><a th:href="@{/todos/add}" class="nav-link">Add TODO</a></li>
                <li class="nav-item"><a th:href="@{/records/}" class="nav-link">View Payment Records</a></li>
                <li class="nav-item"><a th:href="@{/records/add}" class="nav-link">Add Payment Records</a></li>
                <li class="nav-item"><a th:href="@{/leases/}" class="nav-link">View Lease</a></li>
                <li class="nav-item"><a th:href="@{/leases/add}" class="nav-link">Add Lease</a></li>
                <li class="nav-item"><a th:href="@{/users/}" class="nav-link">View Users</a></li>
                <li class="nav-item"><a th:href="@{/users/add}" class="nav-link">Add User</a></li>
                <li class="nav-item"><a th:href="@{/logout}" class="nav-link">Logout</a></li>
            </ul>
        </header>
    </div>
    <div class="container">
        <h1>Things to do</h1>
        <table class="table">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Assignee</th>
                <th scope="col">Task</th>
                <th scope="col">Action</th>
            </tr>
            </thead>
            <tbody>
                <tr th:each="todo:${todos}">
                    <td th:text="${todo.id}"></td>
                    <td th:text="${todo.assignee.firstName + ' ' + todo.assignee.lastName}"></td>
                    <td th:text="${todo.task}"></td>
                    <td>
                        <a th:href="@{/todos/{id}(id=${todo.id})}" class="btn btn-btn-outline-success">View</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="container">
        <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
            <div class="col-md-4 d-flex align-items-center">
                <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1" aria-label="Bootstrap">
                </a> <span class="mb-3 mb-md-0 text-body-secondary">© 2025 Company, Inc</span></div>
            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Instagram">
                </a></li>
                <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Facebook">
                </a></li>
            </ul>
        </footer>
    </div>
</main>

<!-- JS Script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<!-- JS Script -->
</body>
</html>
