  <nav class="navbar navbar-expand-lg bg-white shadow-sm px-3">
    <a class="navbar-brand fw-bold">Logo</a>

    <div class="mx-auto">
      <input class="form-control rounded-pill px-4"
             placeholder="Where are you going?" />
    </div>

    <div class="d-flex align-items-center gap-3">
      <i class="bi bi-globe"></i>

      <div class="dropdown">
        <button class="btn rounded-pill border dropdown-toggle"
                data-bs-toggle="dropdown">
          <i class="bi bi-list"></i>
          <i class="bi bi-person-circle"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item">Login</a></li>
          <li><a class="dropdown-item">Sign up</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container">
    <h1>Payment Records</h1>
    <table class="table">
      <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Assignee</th>
        <th scope="col">Month_Of</th>
        <th scope="col">Amount</th>
        <th scope="col">Date</th>
        <th scope="col">Status</th>
        <th scope="col">Balance</th>
        <th scope="col">Proof of Payment</th>
        <th scope="col">Action</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="record:${paymentRecords}">
        <td th:text="${record.id}"></td>
        <td th:text="${record.assignee.firstName + ' ' + record.assignee.lastName}"></td>
        <td th:text="${record.formattedPeriod}"></td>
        <td th:text="${record.formattedAmount}"></td>
        <td th:text="${record.formattedDate}"></td>
        <td th:text="${record.status}"></td>
        <td th:text="${record.formattedBalance}"></td>
        <td>
          <img th:if="${record.imageUrl != null}"
               th:src="${record.imageUrl}"
               width="100"
               alt="Proof">

          <span th:if="${record.imageUrl == null}">
            No Image
        </span>
        </td>
        <td>
          <a th:href="@{/records/{id}(id=${record.id})}" class="btn btn-btn-outline-success">View</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="container">
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
      <div class="col-md-4 d-flex align-items-center">
        <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1" aria-label="Bootstrap">

        </a></li>
        <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Facebook">
        </a></li>
      </ul>
    </footer>
  </div>
