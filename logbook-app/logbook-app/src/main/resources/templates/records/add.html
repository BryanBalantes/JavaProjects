<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogBook Application</title>
    <style>
      :root {
        --bg-primary: #0f0f1e;
        --bg-secondary: #1a1a2e;
        --bg-tertiary: #16213e;
        --bg-card: rgba(26, 26, 46, 0.5);

        --text-primary: #f8f8f8;
        --text-secondary: #a0a0b0;
        --text-tertiary: #6b7280;

        --border-color: rgba(71, 85, 105, 0.35);

        --accent-purple: #a78bfa;
        --accent-blue: #60a5fa;
        --accent-red: #ef4444;

        --radius: 14px;
        --transition: 0.3s ease;
      }

      /* =========================
       RESET
      ========================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
      }


      /* =========================
       NAVBAR
      ========================= */

      .navbar {
          position: sticky;
          top: 0;
          z-index: 1000;
          background: rgba(26, 26, 46, 0.9);
          backdrop-filter: blur(12px);
          border-bottom: 1px solid var(--border-color);
      }

      .navbar-container {
          max-width: 1280px;
          height: 70px;
          margin: 0 auto;
          padding: 0 24px;

          display: flex;
          align-items: center;
          justify-content: space-between;
      }

      .navbar-brand {
          display: flex;
          align-items: center;
          gap: 12px;
          flex-shrink: 0;
      }

      .brand-logo {
          width: 42px;
          height: 42px;
          object-fit: contain;
      }

      .brand-text {
          font-size: 20px;
          font-weight: 700;
          color: var(--text-primary);
          white-space: nowrap;
      }

      .navbar-menu {
          display: flex;
          align-items: center;
          gap: 10px;
          flex: 1;
          justify-content: center;
      }

      .nav-link,
      .logout-btn {

          display: flex;
          align-items: center;
          gap: 8px;

          padding: 10px 18px;

          text-decoration: none;

          color: var(--text-secondary);

          border-radius: 10px;

          transition: all .3s ease;

          font-size: 15px;

          font-weight: 500;
      }

      .nav-link svg,
      .logout-btn svg {

          width: 18px;
          height: 18px;

          flex-shrink: 0;
      }

      .nav-link:hover,
      .logout-btn:hover {

          background: rgba(255,255,255,.08);

          color: var(--text-primary);

          transform: translateY(-2px);
      }

      .nav-link.active {

          background: rgba(167,139,250,.15);

          color: var(--accent-purple);

          border: 1px solid rgba(167,139,250,.35);
      }

      /* =========================
       CONTAINER
      ========================= */

      .container {
          width: 100%;
          max-width: 900px;
          margin: 0 auto;
          padding: 30px 16px 120px;
      }

      /* =========================
       CARD
      ========================= */

      .card {
        background: var(--bg-secondary);

        border: 1px solid var(--border-color);

        border-radius: 18px;

        padding: 32px;

        box-shadow: 0 10px 25px rgba(0,0,0,.3);
      }

      /* =========================
       HEADING
      ========================= */

      h1 {
        text-align: center;

        color: var(--accent-purple);

        margin-bottom: 30px;

        font-size: clamp(24px, 5vw, 36px);
      }

      /* =========================
       FORM
      ========================= */
      form {
         display: flex;
         flex-direction: column;
         gap: 20px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      label {
        display: block;

        margin-bottom: 8px;

        color: var(--text-secondary);

        font-size: 14px;
        font-weight: 600;
      }

      input,
      select,
      textarea {
        width: 100%;

        padding: 14px 16px;

        border-radius: var(--radius);

        border: 1px solid var(--border-color);

        background: rgba(255,255,255,.05);

        color: white;

        font-size: 15px;

        transition: var(--transition);
      }

      input[type="file"] {
        cursor: pointer;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;

        border-color: var(--accent-purple);

        box-shadow: 0 0 0 4px rgba(167,139,250,.15);
      }

      select option {
        color: #000;
      }

      /* =========================
       IMAGE PREVIEW
      ========================= */

      .preview {
        margin-top: 12px;
      }

      .preview img {
        width: 100%;
        max-width: 320px;
        height: auto;

        border-radius: 10px;

        border: 1px solid var(--border-color);
      }

      /* =========================
       BUTTONS
      ========================= */

      .btn-group {
        margin-top: 32px;

        display: flex;
        gap: 12px;
      }

      .btn {
       border: none;
       border-radius: 12px;
       padding: 14px 24px;
       font-size: 15px;
       font-weight: 600;
       cursor: pointer;
       text-decoration: none;
       transition: var(--transition);
       flex: 1;

       display: flex;
       align-items: center;
       justify-content: center;
      }

      .btn-primary {
        background: var(--accent-purple);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: rgba(255,255,255,.06);
        color: white;
        border: 1px solid var(--border-color);
      }

      .btn-secondary:hover {
        background: rgba(255,255,255,.1);
      }

      /* =========================
       ERROR
      ========================= */

      .error {
        color: #ff7b7b;
        margin-top: 5px;
        font-size: 13px;
      }

      /* =========================
       BOTTOM NAVIGATION
      ========================= */

      .bottom-nav {
        position: fixed;

        bottom: 0;
        left: 0;
        right: 0;

        height: 75px;

        background: var(--bg-secondary);

        border-top: 1px solid var(--border-color);

        display: flex;
        justify-content: space-around;
        align-items: center;

        z-index: 999;
      }

      .bottom-nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: var(--text-secondary);
        font-size: 11px;
        transition: var(--transition);
      }

      .bottom-nav-item svg {
        width: 22px;
        height: 22px;
        margin-bottom: 3px;
      }

      .bottom-nav-item.active,
      .bottom-nav-item:hover {
        color: var(--accent-blue);
      }

      .nav-spacer {
        flex: 1;
      }

      .center-btn {
        position: absolute;

        left: 50%;
        transform: translateX(-50%);

        top: -20px;

        width: 70px;
        height: 70px;

        border-radius: 50%;

        background: var(--bg-primary);

        border: 4px solid var(--bg-secondary);

        display: flex;
        align-items: center;
        justify-content: center;

        box-shadow: 0 10px 25px rgba(0,0,0,.4);
      }

      .center-btn img {
        width: 60px;
        height: 60px;

        object-fit: contain;
      }

      /* =========================
       TABLET & MOBILE
      ========================= */

      @media (max-width: 768px) {

        .navbar {
            display: none;
        }

        .bottom-nav {
            display: flex;
        }

        .container {
          padding-bottom: 220px;
       }

        .card {
            padding: 20px;
            margin-bottom: 120px;
        }

        .form-row {
            grid-template-columns: 1fr;
        }

        .btn-group {
           flex-direction: column;
           margin-bottom: 30px;
        }

        .btn {
            width: 100%;
        }
      }

      /* =========================
       DESKTOP
      ========================= */

      @media (min-width: 769px) {

        .navbar {
            display: block;
        }

        .bottom-nav {
            display: none;
        }
      }

      /* =========================
       SMALL PHONES
      ========================= */

      @media (max-width: 480px) {

        .container {
            padding: 12px;
        }

        .card {
            padding: 16px;
        }

        h1 {
            font-size: 22px;
        }

        label {
            font-size: 13px;
        }

        input,
        select {
            font-size: 14px;
            padding: 12px;
        }

        .center-btn {
            width: 60px;
            height: 60px;
        }

        .center-btn img {
            width: 50px;
            height: 50px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="navbar">
        <div class="navbar-container">

          <div class="navbar-brand">
            <img th:src="@{/images/CommercialSpace_Logo.png}"
                 alt="D AND J RENTALS"

                    D AND J RENTALS

          <div class="navbar-menu">

            </a>

            <a th:href="@{/leases/add}" class="nav-link">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>

          <a th:href="@{/logout}" class="logout-btn">

            <svg width="16" height="16" viewBox="0 0 24 24"

      <!-- Mobile Bottom Navigation -->
      <nav class="bottom-nav">

        <!--        <a th:href="@{/homepage/}" class="bottom-nav-item active">-->

        <!--          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">-->
        <!--            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>-->
        <!--            <polyline points="9 22 9 12 15 12 15 22"/>-->
        <!--          </svg>-->

        <!--          <span>Home</span>-->

        <!--        </a>-->

        <a th:href="@{/commercial-units}" class="bottom-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">

            <!-- Building -->
            <rect x="3" y="2" width="14" height="20" rx="2"></rect>

            <!-- Windows -->
            <path d="M7 6h.01"></path>
            <path d="M11 6h.01"></path>
            <path d="M7 10h.01"></path>
            <path d="M11 10h.01"></path>
            <path d="M7 14h.01"></path>
            <path d="M11 14h.01"></path>

            <!-- Door -->
            <path d="M8 22v-4h4v4"></path>

            <!-- Plus Sign -->
            <path d="M20 8v6"></path>
            <path d="M17 11h6"></path>
          </svg>

          <span>Units</span>
        </a>

        <a th:href="@{/users/}" class="bottom-nav-item">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>

        <a th:href="@{/homepage/}" class="center-btn">

      <div class="container">

        <div class="card">

          <h1>Add a New Monthly Payment</h1>

          <div class="error"
               th:each="error : ${errors}"
               th:text="${error}">
          </div>

          <form th:action="@{/records/add}"
                th:object="${record}"
                method="post"
                enctype="multipart/form-data">

            <div class="form-group">
              <label for="file">Proof of Payment</label>

              <input type="file"
                     id="file"
                     name="file"
                     accept="image/*">
            </div>

            <div class="form-group">
              <label for="period">Month Of</label>

              <input type="month"
                     id="period"
                     th:field="*{period}">

              <div class="error"
                   th:if="${#fields.hasErrors('period')}"
                   th:errors="*{period}">
              </div>
            </div>

            <div class="form-group">
              <label for="amount">Amount</label>

              <input type="number"
                     id="amount"
                     th:field="*{amount}"
                     step="0.01"
                     min="0">

              <div class="error"
                   th:if="${#fields.hasErrors('amount')}"
                   th:errors="*{amount}">
              </div>
            </div>

            <div class="form-group">
              <label for="date">Date</label>

              <input type="datetime-local"
                     id="date"
                     th:field="*{date}">
            </div>

            <div class="form-group">
              <label for="status">Status</label>

              <select id="status"
                      th:field="*{status}">
                <option value="">-- Select Status --</option>
                <option value="Paid">Paid</option>
                <option value="Partial">Partial</option>
              </select>
            </div>

            <div class="form-group">
              <label for="balance">Balance</label>

              <input type="number"
                     id="balance"
                     th:field="*{balance}"
                     step="0.01"
                     min="0">

              <div class="error"
                   th:if="${#fields.hasErrors('balance')}"
                   th:errors="*{balance}">
              </div>
            </div>

            <div class="form-group">
              <label for="assignee">Assignee</label>

              <select id="assignee"
                      th:field="*{assigneeId}">

                <option value="">-- Select Assignee --</option>

                <option th:each="user : ${users}"
                        th:value="${user.id}"
                        th:text="${user.firstName + ' ' + user.lastName}">
                </option>

              </select>
            </div>

            <div class="form-group">
              <label for="lease">Lease</label>

              <select id="lease"
                      th:field="*{leaseId}">

                <option value="">-- Select Commercial Unit --</option>

                <option th:each="lease : ${leases}"
                        th:value="${lease.id}"
                        th:text="'Commercial Unit ' + ${lease.unitName}">>
                </option>

              </select>
            </div>

            <div class="btn-group">

              <button type="submit"
                      class="btn btn-primary">
                Submit
              </button>

              <a th:href="@{/users/}"
                 class="btn btn-secondary">
                Cancel
              </a>

            </div>

          </form>

        </div>

      </div>
    </main>
  </body>
</html>
