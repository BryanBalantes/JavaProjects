<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogBook Application</title>
    <!-- CSS -->
<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">-->
    <!-- CSS -->
    <style>
        :root {
            --bg-primary: #0f0f1e;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --bg-card: rgba(26, 26, 46, 0.5);
            --bg-card-hover: rgba(26, 26, 46, 0.8);

            --text-primary: #f8f8f8;
            --text-secondary: #a0a0b0;
            --text-tertiary: #6b7280;

            --border-color: rgba(71, 85, 105, 0.35);

            --accent-purple: #a78bfa;
            --accent-blue: #60a5fa;
            --accent-red: #ef4444;

            --radius: 14px;
            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            overflow-x: hidden;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            padding-bottom: 90px;
        }

        a {
           text-decoration: none;
       }

        main {
            width: 100%;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 20px 16px;
        }

        /* =========================
           NAVBAR
        ========================= */


        /* Hide desktop navbar on mobile */
        .navbar {
            display: none;

            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid var(--border-color);
            background: rgba(26, 26, 46, 0.5);
            backdrop-filter: blur(10px);
        }
        /*                             */

        .navbar-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 16px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-logo {
            height: 40px;
            width: auto;
            max-width: 120px;
            object-fit: contain;
        }

        .brand-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .navbar-menu {
            display: flex;
            gap: 8px;
            margin-left: 48px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background-color: rgba(71, 85, 105, 0.5);
            color: var(--text-primary);
        }

        .nav-link.active {
            background-color: rgba(167, 139, 250, 0.2);
            color: var(--accent-purple);
            border-color: rgba(167, 139, 250, 0.3);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }

        .logout-btn:hover {
            background-color: rgba(71, 85, 105, 0.5);
            color: var(--text-primary);
        }

        /* =========================
           FORM CARD
        ========================= */

        form {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: var(--accent-purple);

            font-size: clamp(24px, 5vw, 40px);
            font-weight: 700;
        }

        .mb-3 {
            margin-bottom: 20px;
        }

        .form-label,
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-control,
        .form-control-plaintext,
        select,
        textarea,
        input[type="text"],
        input[type="number"],
        input[type="month"],
        input[type="datetime-local"],
        input[type="email"] {
            width: 100%;

            padding: 14px 16px;

            border-radius: var(--radius);
            border: 1px solid var(--border-color);

            background: rgba(255,255,255,0.04);

            color: white;

            font-size: 15px;

            transition: var(--transition);
        }

        .form-control:focus,
        select:focus,
        textarea:focus,
        input:focus {
            outline: none;

            border-color: var(--accent-blue);

            box-shadow: 0 0 0 4px rgba(96,165,250,0.15);
        }

        select {
            appearance: none;
            cursor: pointer;
        }

        select option {
            background: var(--bg-secondary);
            color: white;
        }

        input[type="file"] {
            padding: 12px;
            cursor: pointer;
        }

        .text-danger {
            color: #ff7b7b;
            font-size: 13px;
            margin-top: 6px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .btn {
            border: none;
            border-radius: 12px;

            padding: 14px 20px;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: var(--transition);

            width: 100%;
        }

        .btn-outline-primary,
        .btn-primary {
            background: var(--accent-blue);
            color: #081018;
        }

        .btn-outline-primary:hover,
        .btn-primary:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .btn-danger {
            background: var(--accent-red);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
        }

         .button-group {
            display: flex;
            gap: 12px;
            margin: 20px auto;
            max-width: 900px;
            padding: 0 16px;
        }

        .action-form {
            flex: 1;
        }

        .action-form .btn {
            width: 100%;
        }

        /* Mobile: stack buttons */
        @media (max-width: 576px) {
            .button-group {
                flex-direction: column;
            }
        }

        /* =========================
           ALERT
        ========================= */

        .alert-danger {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ffb4b4;

            border-radius: 12px;

            padding: 14px;
            margin-bottom: 20px;
        }

        /* =========================
           BOTTOM NAV
        ========================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            height: 75px;

            background: var(--bg-secondary);

            border-top: 1px solid var(--border-color);

            display: flex;
            justify-content: space-around;
            align-items: center;

            z-index: 999;
        }

        .bottom-nav-item {
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            color: var(--text-secondary);

            font-size: 11px;

            transition: var(--transition);
        }

        .bottom-nav-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 3px;
        }

        .bottom-nav-item:hover,
        .bottom-nav-item.active {
            color: var(--accent-blue);
        }

        .nav-spacer {
            flex: 1;
        }

        .center-btn {
            position: absolute;

            left: 50%;
            transform: translateX(-50%);

            top: -20px;

            width: 70px;
            height: 70px;

            border-radius: 50%;

            background: var(--bg-primary);

            border: 4px solid var(--bg-secondary);

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .center-btn img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        /* =========================
           FOOTER
        ========================= */
         ul {
            list-style: none;
            padding: 0;
            margin: 0;
         }

        footer {
            margin-top: 40px;
            padding-top: 20px;

            border-top: 1px solid var(--border-color);

            text-align: center;

            color: var(--text-tertiary);
        }

        /* =========================
           TABLET
        ========================= */

        @media (min-width: 768px) {

            .bottom-nav {
                display: none;
            }

            .navbar {
                display: block;
            }

            .container {
                padding: 32px 24px;
            }

            .btn {
                width: auto;
                min-width: 180px;
            }

            form {
                padding: 32px;
            }
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 1024px) {

            .container {
                max-width: 1000px;
            }

            .navbar-container {
                flex-wrap: nowrap;
            }

            .navbar-menu {
                gap: 16px;
            }

            form {
                padding: 40px;
            }
        }

        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 480px) {

            .container {
                padding: 16px 12px;
            }

            form {
                padding: 18px;
                border-radius: 16px;
            }

            .brand-text {
                font-size: 15px;
            }

            .btn {
                font-size: 14px;
                padding: 13px;
            }

            .center-btn {
                width: 65px;
                height: 65px;
            }

            .center-btn img {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>

    <div class="container">
        <h1>Monthly Payment Update</h1>
        <div class="alert alert-danger" th:each="error:${errors}" th:text="${error}"></div>
        <form th:action="@{/records/update}" th:object="${record}" th:method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{leaseId}" th:value="${record.leaseId}" />
                  <div class="mb-3">
                    <label for="file" class="form-label">Proof of Payment</label>
                      <input class="form-control"
                             type="file"
                             id="file"
                             name="file"
                             accept="image/*">
                  </div>
            <div class="mb-3">
                <label for="period" class="form-label">Month Of</label>
                <input type="month"
                       class="form-control"
                       id="period"
                       th:field="*{period}" />

                <div class="text-danger"
                     th:if="${#fields.hasErrors('period')}"
                     th:errors="*{period}">
                </div>
            </div>
            <div class="mb-3">
                <label for="amount" class="form-label">Amount</label>
                <input type="number"
                       class="form-control"
                       id="amount"
                       th:field="*{amount}"
                       step="0.01"
                       min="0"/>

                <div class="text-danger"
                     th:if="${#fields.hasErrors('amount')}"
                     th:errors="*{amount}">
                </div>
            </div>
            <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="datetime-local" class="form-control" id="date" rows="3" th:field="*{date}"/>
            </div>
            <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-control" id="status" th:field="*{status}">
                    <option value="">-- Select Status --</option>
                    <option value="Paid">Paid</option>
                    <option value="Partial">Partial</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="balance" class="form-label">Balance</label>
                <input type="number"
                       class="form-control"
                       id="balance"
                       th:field="*{balance}"
                       step="0.01"
                       min="0"/>

                <div class="text-danger"
                     th:if="${#fields.hasErrors('balance')}"
                     th:errors="*{balance}">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Assignee</label>

                <!-- ✅ Send ID to backend -->
                <input type="hidden" name="assigneeId" th:value="${record.assignee.id}" />

                <!-- 👇 Display only -->
                <div class="form-control-plaintext">
                    <span th:if="${record.assignee != null}"
                          th:text="${record.assignee.firstName + ' ' + record.assignee.lastName}">
                    </span>

                    <span th:if="${record.assignee == null}">
                         No Assignee
                    </span>
                </div>
            </div>

            <div class="mb-3">
                <button type="submit" class="btn btn-outline-primary">Update</button>
            </div>
        </form>
    </div>

    <div class="container">

                </a> <span class="mb-3 mb-md-0 text-body-secondary">© 2025 Company, Inc</span></div>
            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Instagram">
                </a></li>
                <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Facebook">
                </a></li>
            </ul>
        </footer>
    </div>
</main>
